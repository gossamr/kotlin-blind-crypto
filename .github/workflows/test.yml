name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Show versions
        run: |
          java -version
          ./gradlew --version

      - name: Build
        run: ./gradlew :library:assemble

      - name: Test
        # KMP creates per-target test tasks (jvmTest); allTests aggregates them.
        run: ./gradlew :library:allTests

      - name: Lint
        run: ./gradlew detekt

      - name: Benchmark harness (compile only)
        # Builds the JMH jar — benchmark sources + annotation processing —
        # so the harness can't silently rot. Execution happens on local
        # hardware only; shared runners can't produce meaningful numbers.
        run: ./gradlew :benchmarks:jmhJar
